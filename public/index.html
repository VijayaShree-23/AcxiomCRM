<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AcxiomCRM</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4"></script><style>body{background:#f5f7fb}.sidebar{min-height:100vh;background:#0f2942}.sidebar button{color:#dce7f2;text-align:left}.sidebar button.active,.sidebar button:hover{background:#214a70;color:#fff}.card{border:0;box-shadow:0 3px 16px #172b4d12}.kpi{font-size:1.8rem;font-weight:700}.table td,.table th{vertical-align:middle}.brand{font-weight:800;letter-spacing:.5px}.hidden{display:none!important}.toastx{position:fixed;right:20px;top:20px;z-index:9999}</style></head><body><div id="login" class="container py-5"><div class="row justify-content-center"><div class="col-md-5"><div class="card p-4"><h2 class="brand">ACXIOMCRM</h2><p class="text-muted">Secure Sales CRM</p><form id="loginForm"><input id="email" class="form-control mb-3" type="email" placeholder="Email" required><input id="password" class="form-control mb-3" type="password" placeholder="Password" required><button class="btn btn-primary w-100">Login</button></form><div class="small text-muted mt-3">Demo: admin@acxiomcrm.local / Admin@123</div></div></div></div></div><div id="app" class="hidden"><div class="d-flex"><aside class="sidebar p-3" style="width:240px"><div class="text-white fs-4 brand mb-4">ACXIOMCRM</div><div id="nav"></div><hr class="border-secondary"><button class="btn w-100" onclick="logout()">Logout</button></aside><main class="flex-grow-1"><nav class="navbar bg-white px-4 shadow-sm"><span id="pageTitle" class="fw-bold">Dashboard</span><span id="who" class="text-muted"></span></nav><div class="container-fluid p-4"><div id="content"></div></div></main></div></div><div id="toast" class="toastx"></div><script>
let me=null,section='dashboard',chart1,chart2;const $=id=>document.getElementById(id);function toast(msg,ok=false){$('toast').innerHTML=`<div class="alert alert-${ok?'success':'danger'} shadow">${msg}</div>`;setTimeout(()=>$('toast').innerHTML='',2500)}
async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{me=(await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})})).user;showApp()}catch(x){toast(x.message)}};
async function boot(){try{me=await api('/api/me');showApp()}catch{}}
function showApp(){ $('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=`${me.name} · ${me.role}`;buildNav();go('dashboard')}
function buildNav(){let items=[['dashboard','Dashboard'],['customers','Customers'],['leads','Leads'],['opportunities','Opportunities'],['followups','Follow-Ups'],['activities','Activities']];if(me.role!=='SalesExecutive')items.push(['reports','Reports']);if(me.role==='Admin')items.push(['users','Users'],['audit','Audit Log']);$('nav').innerHTML=items.map(x=>`<button class="btn w-100 mb-1 ${section===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
async function go(s){section=s;buildNav();$('pageTitle').textContent=s[0].toUpperCase()+s.slice(1);if(s==='dashboard')return dashboard();if(s==='reports')return reports();if(s==='users')return users();if(s==='audit')return audit();return crud(s)}
async function dashboard(){const d=await api('/api/dashboard');$('content').innerHTML=`<div class="row g-3 mb-4">${[['Customers',d.customers],['Leads',d.leads],['Open Opportunities',d.openOpportunities],['Won',d.won],['Pipeline','₹'+d.pipeline.toLocaleString()],['Pending Follow-Ups',d.pendingFollowups]].map(x=>`<div class="col-6 col-xl-2"><div class="card p-3"><div class="text-muted small">${x[0]}</div><div class="kpi">${x[1]}</div></div></div>`).join('')}</div><div class="row g-4"><div class="col-lg-6"><div class="card p-3"><h5>Lead Status</h5><canvas id="c1"></canvas></div></div><div class="col-lg-6"><div class="card p-3"><h5>Opportunity Pipeline</h5><canvas id="c2"></canvas></div></div></div>`;chart1=new Chart($('c1'),{type:'doughnut',data:{labels:d.leadStatus.map(x=>x.label),datasets:[{data:d.leadStatus.map(x=>x.value)}]}});chart2=new Chart($('c2'),{type:'bar',data:{labels:d.pipelineStages.map(x=>x.label),datasets:[{label:'Opportunities',data:d.pipelineStages.map(x=>x.value)}]}})}
const cfg={customers:{title:'Customers',fields:[['name','Customer Name','text'],['email','Email','email'],['phone','Phone','text'],['companyName','Company','text'],['address','Address','text'],['city','City','text'],['state','State','text'],['status','Status','text']]},leads:{title:'Leads',fields:[['name','Lead Name','text'],['email','Email','email'],['phone','Phone','text'],['companyName','Company','text'],['source','Source','text'],['status','Status','text'],['expectedValue','Expected Value','number']]},opportunities:{title:'Opportunities',fields:[['name','Opportunity Name','text'],['customerId','Customer ID','text'],['amount','Amount','number'],['stage','Stage','text'],['probability','Probability','number'],['expectedCloseDate','Expected Close Date','date']]},followups:{title:'Follow-Ups',fields:[['customerId','Customer ID','text'],['leadId','Lead ID','text'],['followUpDate','Follow-Up Date','date'],['followUpType','Type','text'],['remarks','Remarks','text'],['status','Status','text']]},activities:{title:'Activities',fields:[['activityType','Type','text'],['subject','Subject','text'],['description','Description','text'],['activityDate','Activity Date','date'],['customerId','Customer ID','text'],['status','Status','text']]}};
async function crud(s){const c=cfg[s],data=await api('/api/'+s);$('content').innerHTML=`<div class="card p-3"><div class="d-flex justify-content-between align-items-center mb-3"><h4>${c.title}</h4><button class="btn btn-primary" onclick="form('${s}')">+ Add</button></div><input id="q" class="form-control mb-3" placeholder="Search..." oninput="filterRows()"><div class="table-responsive"><table class="table"><thead><tr>${c.fields.map(f=>`<th>${f[1]}</th>`).join('')}<th>Actions</th></tr></thead><tbody id="rows">${data.map(r=>row(s,r)).join('')}</tbody></table></div></div>`}
function row(s,r){const c=cfg[s];return `<tr>${c.fields.map(f=>`<td>${r[f[0]]??''}</td>`).join('')}<td><button class="btn btn-sm btn-outline-primary" onclick='form(${JSON.stringify(s)},${JSON.stringify(r)})'>Edit</button> <button class="btn btn-sm btn-outline-danger" onclick="del('${s}','${r.id}')">Delete</button></td></tr>`}function filterRows(){const q=$('q').value.toLowerCase();document.querySelectorAll('#rows tr').forEach(tr=>tr.style.display=tr.innerText.toLowerCase().includes(q)?'':'none')}
function form(s,r={}){const c=cfg[s];$('content').innerHTML=`<div class="card p-4"><h4>${r.id?'Edit':'Create'} ${c.title.slice(0,-1)}</h4><form id="record">${c.fields.map(f=>`<div class="mb-3"><label class="form-label">${f[1]}</label><input class="form-control" name="${f[0]}" type="${f[2]}" value="${r[f[0]]??''}" ${f[0]==='name'?'required':''}></div>`).join('')}<button class="btn btn-primary">Save</button> <button type="button" class="btn btn-secondary" onclick="go('${s}')">Cancel</button></form></div>`;$('record').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e));try{await api('/api/'+s+(r.id?'/'+r.id:''),{method:r.id?'PUT':'POST',body:JSON.stringify(d)});toast('Saved successfully',true);go(s)}catch(x){toast(x.message)}}}
async function del(s,id){if(!confirm('Delete this record?'))return;try{await api('/api/'+s+'/'+id,{method:'DELETE'});toast('Deleted',true);go(s)}catch(x){toast(x.message)}}
async function users(){const d=await api('/api/users');$('content').innerHTML=`<div class="card p-3"><div class="d-flex justify-content-between"><h4>Users & Roles</h4><button class="btn btn-primary" onclick="newUser()">+ User</button></div><table class="table mt-3"><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Lockout</th></tr>${d.map(x=>`<tr><td>${x.name}</td><td>${x.email}</td><td>${x.role}</td><td>${x.active?'Active':'Inactive'}</td><td>${x.lockoutEnd||'-'}</td></tr>`).join('')}</table></div>`}function newUser(){const name=prompt('Name'),email=prompt('Email'),password=prompt('Password (8+)'),role=prompt('Role: Admin, Manager, SalesExecutive');if(!name)return;api('/api/users',{method:'POST',body:JSON.stringify({name,email,password,role})}).then(()=>{toast('User created',true);users()}).catch(x=>toast(x.message))}
async function audit(){const d=await api('/api/audit');$('content').innerHTML=`<div class="card p-3"><h4>Audit Log</h4><div class="table-responsive"><table class="table"><tr><th>Date</th><th>Action</th><th>Entity</th><th>Record</th><th>Result</th></tr>${d.map(x=>`<tr><td>${new Date(x.createdDate).toLocaleString()}</td><td>${x.action}</td><td>${x.entityName}</td><td>${x.recordId||''}</td><td>${x.result}</td></tr>`).join('')}</table></div></div>`}
async function reports(){const d=await api('/api/reports/pipeline');$('content').innerHTML=`<div class="card p-4"><h4>Pipeline Report</h4><table class="table mt-3"><tr><th>Stage</th><th>Count</th><th>Amount</th><th>Weighted Pipeline</th></tr>${d.map(x=>`<tr><td>${x.stage}</td><td>${x.count}</td><td>₹${x.amount.toLocaleString()}</td><td>₹${x.weighted.toLocaleString()}</td></tr>`).join('')}</table></div>`}
async function logout(){await api('/api/auth/logout',{method:'POST'}).catch(()=>{});location.reload()}boot();</script></body></html>
